<!DOCTYPEhtml>
<htmllang="en">
<head>
<metacharset="UTF-8"/>
<title>LunaMood–CyberpunkHUDv2</title>
<linkrel="stylesheet"href="/css/cyberpunk-neon.css">
<style>
:root{
--bg-glass:rgba(4,6,20,0.8);
--border-neon:linear-gradient(135deg,#00f5ff,#ff00ff,#ffcc00);
--text-main:#e6f7ff;
--text-sub:#8ef0ff;
--shadow-neon:0018pxrgba(0,255,255,0.8),
0028pxrgba(255,0,255,0.5);
}

*{box-sizing:border-box;}

body{
margin:0;
padding:0;
background:transparent;
overflow:hidden;
font-family:system-ui,-apple-system,BlinkMacSystemFont,"SegoeUI",sans-serif;
}

.hud-root{
position:fixed;
left:24px;
bottom:24px;
width:360px;
height:160px;
background:
radial-gradient(circleattopleft,rgba(0,255,255,0.16),transparent60%),
radial-gradient(circleatbottomright,rgba(255,0,255,0.22),transparent65%),
var(--bg-glass);
border-radius:18px;
border:1pxsolidrgba(0,255,255,0.4);
box-shadow:0024pxrgba(0,0,0,0.8);
backdrop-filter:blur(14px);
-webkit-backdrop-filter:blur(14px);
overflow:hidden;
}

.hud-border{
position:absolute;
inset:0;
border-radius:inherit;
padding:1px;
pointer-events:none;
}

.hud-border::before{
content:"";
position:absolute;
inset:0;
border-radius:inherit;
background-image:var(--border-neon);
opacity:0.9;
mix-blend-mode:screen;
filter:blur(1px);
animation:borderFlow8slinearinfinite;
}

@keyframesborderFlow{
0%{opacity:0.4;filter:blur(1px);}
50%{opacity:0.9;filter:blur(2px);}
100%{opacity:0.4;filter:blur(1px);}
}

.hud-inner{
position:relative;
z-index:1;
width:100%;
height:100%;
padding:8px10px10px10px;
display:grid;
grid-template-columns:auto1fr;
grid-template-rows:autoauto1fr;
column-gap:10px;
row-gap:4px;
}

/*miniLunaicon*/
.avatar-wrap{
grid-row:1/span2;
grid-column:1/2;
display:flex;
align-items:center;
justify-content:center;
}

.avatar-orbit{
position:relative;
width:52px;
height:52px;
border-radius:999px;
background:radial-gradient(circleat30%30%,#ffffff,#9999ff40%,transparent70%);
box-shadow:0020pxrgba(0,255,255,0.5);
overflow:hidden;
}

.avatar-orbit::before{
/*วงแหวนหมุน*/
content:"";
position:absolute;
inset:-2px;
border-radius:inherit;
border:2pxsolidrgba(255,255,255,0.45);
border-top-color:transparent;
border-left-color:transparent;
mix-blend-mode:screen;
animation:orbitSpin4slinearinfinite;
}

@keyframesorbitSpin{
0%{transform:rotate(0deg);}
100%{transform:rotate(360deg);}
}

.avatar-core{
position:absolute;
inset:8px;
border-radius:inherit;
background:radial-gradient(circleat30%20%,#fff,#ffe6ff30%,transparent60%);
box-shadow:0016pxrgba(255,255,255,0.8);
}

.avatar-eye{
position:absolute;
top:50%;
left:50%;
width:26px;
height:12px;
margin-left:-13px;
margin-top:-6px;
border-radius:999px;
background:rgba(0,0,0,0.8);
overflow:hidden;
}

.avatar-eye-inner{
position:absolute;
inset:2px;
border-radius:inherit;
background:radial-gradient(circleat20%50%,#fff,#00f5ff40%,#ff00ff80%);
opacity:0.0;
transition:opacity0.2sease-out;
}

/*header*/
.hud-header{
grid-column:2/3;
grid-row:1/2;
display:flex;
align-items:baseline;
justify-content:space-between;
gap:8px;
}

.hud-title{
font-size:13px;
letter-spacing:0.18em;
text-transform:uppercase;
color:var(--text-main);
text-shadow:var(--shadow-neon);
position:relative;
overflow:hidden;
}

.hud-title::after{
content:"";
position:absolute;
left:-40%;
top:50%;
width:40%;
height:1px;
background:linear-gradient(90deg,transparent,#00f5ff,transparent);
opacity:0.7;
animation:scan2.4slinearinfinite;
}

@keyframesscan{
0%{left:-40%;}
100%{left:110%;}
}

.hud-tag{
font-size:10px;
color:var(--text-sub);
opacity:0.9;
text-transform:uppercase;
}

.mood-value{
grid-column:2/3;
grid-row:2/3;
font-size:16px;
color:var(--text-main);
text-shadow:var(--shadow-neon);
}

.mood-valuespan{
font-weight:600;
}

/*moodbar*/
.mood-bar-shell{
position:relative;
grid-column:1/3;
grid-row:3/4;
height:22px;
border-radius:999px;
background:rgba(6,10,30,0.95);
overflow:hidden;
border:1pxsolidrgba(0,180,255,0.45);
box-shadow:0001pxrgba(0,0,0,0.6);
}

.mood-bar-track{
position:absolute;
inset:0;
background:
repeating-linear-gradient(
135deg,
rgba(0,255,255,0.15)0,
rgba(0,255,255,0.15)4px,
transparent4px,
transparent8px
);
opacity:0.4;
mix-blend-mode:screen;
animation:trackMove9slinearinfinite;
}

@keyframestrackMove{
0%{transform:translateX(0);}
100%{transform:translateX(-32px);}
}

.mood-bar-fill{
position:absolute;
left:0;
top:0;
bottom:0;
width:50%;
border-radius:inherit;
background:linear-gradient(90deg,#00f5ff,#ff00ff);
box-shadow:var(--shadow-neon);
transform-origin:leftcenter;
transition:
width0.18sease-out,
background0.18sease-out,
box-shadow0.18sease-out;
}

.mood-bar-zero{
position:absolute;
top:2px;
bottom:2px;
left:50%;
width:2px;
border-radius:999px;
background:linear-gradient(tobottom,transparent,rgba(255,255,255,0.5),transparent);
opacity:0.7;
}

.mood-scale{
position:absolute;
bottom:2px;
left:9px;
right:9px;
display:flex;
justify-content:space-between;
font-size:9px;
color:rgba(200,240,255,0.7);
text-transform:uppercase;
pointer-events:none;
}

.mood-state{
position:absolute;
top:2px;
left:9px;
right:9px;
font-size:10px;
color:rgba(200,240,255,0.9);
text-shadow:006pxrgba(0,255,255,0.4);
display:flex;
justify-content:space-between;
gap:6px;
}

#moodDelta{
min-width:60px;
text-align:right;
letter-spacing:0.03em;
}

#moodState{
color:#000000!important;
text-shadow:none!important;
}

.mood-statespan{
opacity:0.9;
}

/*graph*/
.graph-wrap{
position:absolute;
inset:auto8px8px8px;
height:40px;
border-radius:10px;
overflow:hidden;
border:1pxsolidrgba(0,220,255,0.35);
background:radial-gradient(circleattop,rgba(0,0,0,0.6),transparent70%);
}

#moodGraph{
width:100%;
height:100%;
display:block;
}

/*alerts*/
.alerts{
position:absolute;
top:8px;
right:10px;
display:flex;
flex-direction:column;
align-items:flex-end;
gap:2px;
pointer-events:none;
}

.alert-chip{
font-size:10px;
text-transform:uppercase;
padding:3px7px;
border-radius:999px;
background:rgba(10,18,40,0.92);
border:1pxsolidrgba(0,255,255,0.7);
color:#e6ffff;
box-shadow:0010pxrgba(0,255,255,0.7);
animation:alertIn0.18sease-out,alertOut0.6sease-inforwards;
animation-delay:0s,2.4s;
white-space:nowrap;
}

@keyframesalertIn{
0%{transform:translateY(-8px);opacity:0;}
100%{transform:translateY(0);opacity:1;}
}

@keyframesalertOut{
0%{opacity:1;transform:translateY(0);}
100%{opacity:0;transform:translateY(-6px);}
}

/*particles*/
.particle{
position:absolute;
width:6px;
height:6px;
border-radius:50%;
pointer-events:none;
mix-blend-mode:screen;
opacity:0.9;
animation:particleFly700msease-outforwards;
}

@keyframesparticleFly{
0%{transform:translate(0,0)scale(1);opacity:1;}
100%{transform:translate(var(--dx),var(--dy))scale(0.2);opacity:0;}
}
</style>
</head>
<bodyclass="cyber-page">

<divclass="hud-root">
<divclass="hud-border"></div>
<divclass="hud-inner">
<!--miniLunaicon-->
<divclass="avatar-wrap">
<divclass="avatar-orbit"id="avatarOrbit">
<divclass="avatar-core"></div>
<divclass="avatar-eye">
<divclass="avatar-eye-inner"id="avatarEye"></div>
</div>
</div>
</div>

<!--header-->
<divclass="hud-header">
<divclass="hud-title">LUNAMOOD</div>
</div>

<!--numericmood-->
<divclass="mood-value">
mood:<spanid="moodValue">0.0</span>
</div>

<!--moodbar-->
<divclass="mood-bar-shell">
<divclass="mood-bar-track"></div>
<divclass="mood-bar-fill"id="moodFill"></div>
<divclass="mood-bar-zero"></div>
<divclass="mood-state">
<spanid="moodState">status:idle</span>
</div>
<divclass="mood-scale">
<span>-10</span>
<span>0</span>
<span>+10</span>
</div>
</div>

<!--graph-->
<divclass="graph-wrap">
<canvasid="moodGraph"></canvas>
</div>

<!--alerts+particlescontainer-->
<divclass="alerts"id="alerts"></div>
</div>
</div>

<script>
//WebSockettoLunaserver
constws=newWebSocket("ws://localhost:8787");

ws.onopen=()=>{
console.log("[moodHUD]connectedtoLuna");
};

ws.onmessage=(msg)=>{
try{
constdata=JSON.parse(msg.data);
if(data.type==="mood_update"&&data.mood&&typeofdata.mood.value==="number"){
handleMoodUpdate(data.mood.value);
}
if(data.type==="audio_react"&&typeofdata.level==="number"){
audioTarget=Math.max(0,Math.min(1,data.level));
}
//ถ้าอนาคตมีeventอื่นbroadcastมาก็จับเพิ่มได้ที่นี่
}catch(e){
console.warn("[moodHUD]parseerror:",e);
}
};

ws.onerror=(e)=>{
console.warn("[moodHUD]wserror:",e);
};

//---audiosfx(ไม่มีไฟล์ใช้WebAudioสร้างเสียงสั้นๆ)---
letaudioCtx=null;
functionplayChime(delta){
if(!audioCtx){
try{
audioCtx=new(window.AudioContext||window.webkitAudioContext)();
}catch{
return;//browserไม่รองรับก็เงียบไป
}
}
constctx=audioCtx;
constosc=ctx.createOscillator();
constgain=ctx.createGain();

constabs=Math.abs(delta);
letbaseFreq=delta>0?880:440;
if(abs>=2)baseFreq*=1.4;
elseif(abs<=0.5)baseFreq*=0.7;

osc.frequency.value=baseFreq;
gain.gain.value=0.18;

osc.connect(gain);
gain.connect(ctx.destination);

constnow=ctx.currentTime;
osc.start(now);
gain.gain.exponentialRampToValueAtTime(0.001,now+0.25);
osc.stop(now+0.26);
}

//---state&helpers---
letlastMood=0;
letmoodHistory=[];//{t,v}
letaudioLevel=0;//smoothedvalue0..1
letaudioTarget=0;//lasttargetfromserver

constmoodValueEl=document.getElementById("moodValue");
constmoodFillEl=document.getElementById("moodFill");
constmoodStateEl=document.getElementById("moodState");
constavatarOrbitEl=document.getElementById("avatarOrbit");
constavatarEyeEl=document.getElementById("avatarEye");
constalertsEl=document.getElementById("alerts");

constgraphCanvas=document.getElementById("moodGraph");
constgctx=graphCanvas.getContext("2d");

functionclamp(v,min,max){
returnMath.min(max,Math.max(min,v));
}

functionresizeGraph(){
constrect=graphCanvas.getBoundingClientRect();
graphCanvas.width=rect.width*window.devicePixelRatio;
graphCanvas.height=rect.height*window.devicePixelRatio;
gctx.setTransform(window.devicePixelRatio,0,0,window.devicePixelRatio,0,0);
drawGraph();
}

window.addEventListener("resize",resizeGraph);

functionhandleMoodUpdate(val){
constv=clamp(val,-10,10);
constdelta=v-lastMood;
lastMood=v;

constnow=Date.now();
moodHistory.push({t:now,v});
//เก็บประมาณ60วิล่าสุด
constcutoff=now-60000;
moodHistory=moodHistory.filter((p)=>p.t>=cutoff);

updateHUD(v,delta);
drawGraph();
if(Math.abs(delta)>=0.3){
playChime(delta);
spawnAlert(delta);
if(Math.abs(delta)>=2){
spawnParticles();
}
}
}

functionupdateHUD(v,delta){
moodValueEl.textContent=v.toFixed(1);

constt=(v+10)/20;
constpct=clamp(t,0,1);
constminWidth=0.05;
constwidth=minWidth+pct*(1-minWidth);
moodFillEl.style.width=(width*100)+"%";

letgradient;
letstateText;
letavatarGlow;
leteyeIntensity;

if(v>=4){
gradient="linear-gradient(90deg,#ff00ff,#ffcc00)";
stateText="status:OVERDRIVE/HYPE";
avatarGlow="0025pxrgba(255,0,255,0.95)";
eyeIntensity=1.0;
}elseif(v>=2){
gradient="linear-gradient(90deg,#00f5ff,#ff66ff)";
stateText="status:upbeat/playful";
avatarGlow="0022pxrgba(0,245,255,0.9)";
eyeIntensity=0.9;
}elseif(v>-1){
gradient="linear-gradient(90deg,#00f0ff,#7bffea)";
stateText="status:stable/neutral";
avatarGlow="0016pxrgba(0,230,255,0.75)";
eyeIntensity=0.6;
}elseif(v<=-4){
gradient="linear-gradient(90deg,#ff0044,#7b00ff)";
stateText="status:lowenergy/hurt";
avatarGlow="0022pxrgba(255,0,80,0.9)";
eyeIntensity=0.8;
}else{
gradient="linear-gradient(90deg,#ff8844,#ff3377)";
stateText="status:stressed/moody";
avatarGlow="0020pxrgba(255,136,68,0.9)";
eyeIntensity=0.7;
}

moodFillEl.style.background=gradient;
moodStateEl.textContent=stateText;

avatarOrbitEl.style.boxShadow=avatarGlow;
avatarEyeEl.style.opacity=eyeIntensity;
}

functiondrawGraph(){
constw=graphCanvas.width/window.devicePixelRatio;
consth=graphCanvas.height/window.devicePixelRatio;
gctx.clearRect(0,0,w,h);

if(moodHistory.length<2)return;

constnow=Date.now();
constspan=60000;//60วิ
constminV=-10;
constmaxV=10;

gctx.lineWidth=1.4;
gctx.strokeStyle="rgba(0,255,255,0.85)";
gctx.beginPath();

moodHistory.forEach((p,idx)=>{
consttNorm=clamp((p.t-(now-span))/span,0,1);
constx=tNorm*w;
constvNorm=(p.v-minV)/(maxV-minV);
consty=h-vNorm*h;
if(idx===0)gctx.moveTo(x,y);
elsegctx.lineTo(x,y);
});

gctx.stroke();

//baseline0
constzeroNorm=(0-minV)/(maxV-minV);
constzy=h-zeroNorm*h;
gctx.strokeStyle="rgba(255,255,255,0.25)";
gctx.lineWidth=1;
gctx.beginPath();
gctx.moveTo(0,zy);
gctx.lineTo(w,zy);
gctx.stroke();
}

functionspawnAlert(delta){
constchip=document.createElement("div");
chip.className="alert-chip";

letlabel;
constabs=Math.abs(delta);
if(abs>=2){
label=delta>0?"spike++":"crash--";
}elseif(abs>=1){
label=delta>0?"boost+":"drop-";
}else{
label=delta>0?"tickup":"tickdown";
}

chip.textContent=label+"("+(delta>=0?"+":"")+delta.toFixed(1)+")";
alertsEl.appendChild(chip);

setTimeout(()=>{
chip.remove();
},3200);
}

functionspawnParticles(){
constroot=document.querySelector(".hud-root");
constrect=root.getBoundingClientRect();
constcenterX=rect.width/2;
constcenterY=rect.height/2;

for(leti=0;i<16;i++){
constp=document.createElement("div");
p.className="particle";

constangle=Math.random()*Math.PI*2;
constdist=40+Math.random()*40;
constdx=Math.cos(angle)*dist;
constdy=Math.sin(angle)*dist*0.7;

p.style.left=centerX+"px";
p.style.top=centerY+"px";
p.style.setProperty("--dx",dx+"px");
p.style.setProperty("--dy",dy+"px");

constcolorStops=[
"rgba(0,255,255,1)",
"rgba(255,0,255,1)",
"rgba(255,255,0,1)",
];
constc=colorStops[Math.floor(Math.random()*colorStops.length)];
p.style.background=c;
p.style.boxShadow="0012px"+c;

root.appendChild(p);
setTimeout(()=>p.remove(),800);
}
}

functionapplyAudioReactVisual(level){
constclamped=Math.max(0,Math.min(1,level));

//Pulsetheavatarabit
constavatar=document.getElementById("avatarOrbit");
if(avatar){
constscale=1+clamped*0.12;//upto+12%
avatar.style.transform=`scale(${scale})`;
}

//Boostthemoodbarglowbyaudiolevel
constbarFill=document.getElementById("moodFill");
if(barFill){
constbaseShadow="0018pxrgba(0,255,255,0.6),0028pxrgba(255,0,255,0.4)";
conststrongShadow="0026pxrgba(0,255,255,0.9),0040pxrgba(255,0,255,0.9)";
//interpolatebetweentwoshadows
barFill.style.boxShadow=clamped>0.35?strongShadow:baseShadow;
}

//Optionally,wecanalsopulsethewholeHUDslightly
consthudRoot=document.querySelector(".hud-root");
if(hudRoot){
consts=1+clamped*0.04;//subtlescaleforentireHUD
hudRoot.style.transform=`scale(${s})`;
}
}

functionaudioReactLoop(){
//simplesmoothing:move15%towardstargeteachframe
audioLevel+=(audioTarget-audioLevel)*0.15;
applyAudioReactVisual(audioLevel);
requestAnimationFrame(audioReactLoop);
}

//initialsetup
resizeGraph();
handleMoodUpdate(0);
audioReactLoop();
</script>

</body>
</html>
