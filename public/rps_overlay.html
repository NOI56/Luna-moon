<!DOCTYPEhtml>
<htmllang="en">
<head>
<metacharset="UTF-8">
<metaname="viewport"content="width=device-width,initial-scale=1.0">
<title>LunaRPSGameOverlay</title>
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body.overlay-page{
font-family:'SpaceGrotesk',var(--mono,'CourierNew',monospace);
background:transparent;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
color:var(--cyber-cyan,#00ffff);
overflow:hidden;
padding:0;
}

body.overlay-page::before,
body.overlay-page::after{
content:none;
display:none;
}

.overlay-container{
text-align:center;
padding:28px;
background:var(--panel,rgba(5,8,30,0.9));
border:1pxsolidvar(--panel-border-strong,rgba(0,255,255,0.4));
border-radius:24px;
box-shadow:
var(--panel-shadow,0035pxrgba(0,0,0,0.65)),
0040pxrgba(0,255,255,0.25),
inset0020pxrgba(0,255,255,0.08);
min-width:420px;
display:none;
position:relative;
backdrop-filter:blur(18px);
}

.overlay-container::before{
content:'';
position:absolute;
top:-2px;
left:-2px;
right:-2px;
bottom:-2px;
background:linear-gradient(45deg,var(--cyber-cyan,#00ffff),var(--cyber-pink,#ff00ff),var(--cyber-purple,#7427ff));
z-index:-1;
animation:borderGlow3sease-in-outinfinite;
opacity:0.5;
}

@keyframesborderGlow{
0%,100%{opacity:0.3;}
50%{opacity:0.7;}
}

.overlay-container.active{
display:block;
animation:slideIn0.5sease-out;
}

@keyframesslideIn{
from{
opacity:0;
transform:translateY(-20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.game-title{
font-size:1.6em;
margin-bottom:18px;
font-weight:600;
color:var(--cyber-cyan,#00ffff);
text-shadow:
0012pxvar(--cyber-cyan,#00ffff),
0026pxrgba(0,255,255,0.45);
letter-spacing:0.35em;
text-transform:uppercase;
}

.hands-display{
display:flex;
justify-content:space-around;
align-items:center;
margin:20px0;
gap:30px;
}

.hand-display{
text-align:center;
}

.hand-label{
font-size:0.95em;
margin-bottom:10px;
color:var(--cyber-cyan,#00ffff);
text-shadow:0012pxvar(--cyber-cyan,#00ffff);
opacity:0.9;
letter-spacing:0.3em;
}

.hand-icon{
font-size:5em;
filter:
drop-shadow(0010pxvar(--cyber-cyan,#00ffff))
drop-shadow(0020pxvar(--cyber-cyan,#00ffff))
drop-shadow(04px8pxrgba(0,0,0,0.8));
animation:popIn0.5sease-out;
display:flex;
justify-content:center;
align-items:center;
}

.hand-iconimg{
width:120px;
height:120px;
object-fit:contain;
filter:
drop-shadow(0010pxvar(--cyber-cyan,#00ffff))
drop-shadow(0020pxrgba(0,255,255,0.45));
}

@keyframespopIn{
from{
transform:scale(0);
}
to{
transform:scale(1);
}
}

.vs{
font-size:2.2em;
font-weight:700;
color:var(--cyber-pink,#ff00ff);
text-shadow:
0012pxvar(--cyber-pink,#ff00ff),
0024pxrgba(255,0,255,0.5);
letter-spacing:0.5em;
animation:vsPulse1.5sease-in-outinfinite;
}

@keyframesvsPulse{
0%,100%{
transform:scale(1);
opacity:1;
}
50%{
transform:scale(1.1);
opacity:0.8;
}
}

.result-text{
font-size:1.8em;
margin-top:15px;
font-weight:bold;
min-height:40px;
}

.result-text.win{
color:#00ff00;
text-shadow:
0010px#00ff00,
0020px#00ff00,
0030px#00ff00;
}

.result-text.lose{
color:#ff0066;
text-shadow:
0010px#ff0066,
0020px#ff0066,
0030px#ff0066;
}

.result-text.tie{
color:#ffff00;
text-shadow:
0010px#ffff00,
0020px#ffff00,
0030px#ffff00;
}

.player-name{
font-size:0.9em;
margin-top:10px;
color:var(--cyber-pink,#ff00ff);
text-shadow:0012pxvar(--cyber-pink,#ff00ff);
opacity:0.9;
letter-spacing:0.25em;
}

.fade-out{
animation:fadeOut0.5sease-outforwards;
}

@keyframesfadeOut{
to{
opacity:0;
transform:translateY(20px);
}
}
</style>
<linkrel="stylesheet"href="/css/cyberpunk-neon.css">
</head>
<bodyclass="cyber-pageoverlay-page">
<divid="overlay"class="overlay-container">
<divclass="game-title">🪨✂️📄RockPaperScissors</div>
<divclass="hands-display">
<divclass="hand-display">
<divclass="hand-label"id="playerLabel">Player</div>
<divclass="hand-icon"id="playerHand"></div>
</div>
<divclass="vs">VS</div>
<divclass="hand-display">
<divclass="hand-label">Luna</div>
<divclass="hand-icon"id="lunaHand"></div>
</div>
</div>
<divclass="result-text"id="result"></div>
<divclass="player-name"id="playerName"></div>
</div>

<script>
constAPI_BASE=window.location.origin.replace(':8787',':8787');
constWS_URL=`ws://${window.location.hostname}:8787`;

//Handimages-ใช้รูปมือจริงจากไฟล์
//ใส่รูปมือPNGที่คุณส่งมาในpublic/images/hands/:
//-rock.png(มือกำ)-ใช้เป็นdefaultด้วย
//-paper.png(มือเปิด)
//-scissors.png(มือชู2นิ้ว)
constHAND_IMAGES={
rock:'/images/hands/rock.png',
paper:'/images/hands/paper.png',
scissors:'/images/hands/scissors.png',
default:'/images/hands/rock.png'//ใช้มือกำเป็นdefault
};

constHAND_EMOJIS={
rock:'🪨',
paper:'📄',
scissors:'✂️',
default:'👋'
};

//Functiontogethanddisplay(imageoremojifallback)
functiongetHandDisplay(choice){
constimg=document.createElement('img');
img.src=HAND_IMAGES[choice]||HAND_IMAGES.default;
img.alt=choice||'default';
img.onerror=function(){
//Fallbacktoemojiifimagefailstoload
this.parentElement.textContent=HAND_EMOJIS[choice]||HAND_EMOJIS.default;
};
returnimg;
}

letws=null;
lethideTimeout=null;

//ConnecttoWebSocket
functionconnectWebSocket(){
try{
ws=newWebSocket(WS_URL);

ws.onopen=()=>{
console.log('[RPSOverlay]WebSocketconnected');
};

ws.onmessage=(event)=>{
try{
constdata=JSON.parse(event.data);

if(data.type==='rps_game'){
showGameResult(data);
}
}catch(e){
console.error('[RPSOverlay]Parseerror:',e);
}
};

ws.onerror=(error)=>{
console.error('[RPSOverlay]WebSocketerror:',error);
};

ws.onclose=()=>{
console.log('[RPSOverlay]WebSocketclosed,reconnecting...');
setTimeout(connectWebSocket,3000);
};
}catch(e){
console.error('[RPSOverlay]Connectionerror:',e);
setTimeout(connectWebSocket,3000);
}
}

//Showgameresult
functionshowGameResult(data){
constoverlay=document.getElementById('overlay');
constplayerHand=document.getElementById('playerHand');
constlunaHand=document.getElementById('lunaHand');
constresult=document.getElementById('result');
constplayerName=document.getElementById('playerName');
constplayerLabel=document.getElementById('playerLabel');

//Clearprevioustimeout
if(hideTimeout){
clearTimeout(hideTimeout);
}

//Updatedisplay
playerHand.innerHTML='';
playerHand.appendChild(getHandDisplay(data.playerChoice));
lunaHand.innerHTML='';
lunaHand.appendChild(getHandDisplay(data.lunaChoice));
playerName.textContent=data.player||'Player';
playerLabel.textContent=data.player||'Player';

//Showresult
if(data.result==='win'){
result.textContent='🎉PlayerWins!';
result.className='result-textwin';
}elseif(data.result==='lose'){
result.textContent='😢LunaWins!';
result.className='result-textlose';
}else{
result.textContent='🤝Tie!';
result.className='result-texttie';
}

//Showoverlay
overlay.classList.add('active');
overlay.classList.remove('fade-out');

//Hideafter5seconds
hideTimeout=setTimeout(()=>{
overlay.classList.add('fade-out');
setTimeout(()=>{
overlay.classList.remove('active');
},500);
},5000);
}

//Initialize
document.addEventListener('DOMContentLoaded',()=>{
connectWebSocket();
initializeHands();
});

//Initializehanddisplays
functioninitializeHands(){
constplayerHand=document.getElementById('playerHand');
constlunaHand=document.getElementById('lunaHand');

//Setdefaulthands(ใช้มือกำ)
playerHand.appendChild(getHandDisplay('rock'));
lunaHand.appendChild(getHandDisplay('rock'));
}
</script>
</body>
</html>
